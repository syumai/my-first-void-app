name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_destructive:
        description: "Allow destructive migrations (DROP / DELETE etc.) to run against the remote database"
        type: boolean
        default: false

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts/*
          cache: true
      - run: vp install --frozen-lockfile
      - name: Check destructive migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOW_DESTRUCTIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_destructive }}
        run: |
          # void db status reads the deploy target from .void/project.json (gitignored) to show remote status
          [ -f .void/project.json ] || { mkdir -p .void && echo '{"platform":"cloudflare"}' > .void/project.json; }
          scripts/check-destructive-migrations.sh
      - name: Deploy
        env:
          # Add this scoped token at Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Required only for PostgreSQL/MySQL provisioning and migrations.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Required in fresh checkouts when a Worker Version has no preview URL.
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          # Required only when Cloudflare Access protects Worker readiness.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: vp exec void deploy --platform cloudflare
